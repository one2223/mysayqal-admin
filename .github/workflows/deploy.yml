# Serverga chiqarish — FAQAT `production` branch'iga push qilinganda yoki qo'lda (tekshiruv uchun Actions YO'Q:
# typecheck/lint/test/build lokal). One-POS-frontend andozasi bilan bir xil. Yig'ish shu yerda (Node 22),
# serverga faqat tayyor `dist/` boradi — nginx fayllarni o'zi beradi.
#
# Serverda: /srv/mysayqal/admin/releases/<vaqt> → `current` havolasi bir zumda almashadi, oxirgi 5 versiya qoladi.
# Server qiymatlari — quyida (sir emas); kalit — secret DEPLOY_KEY (mysayqal-frontend dagi bilan bir xil). Qo'llanma: mysayqal-backend deploy/README.md.
# Chiqarish: `git push origin main:production`.
name: Deploy admin

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

env:
  # Sir emas (mysayqal-backend deploy.yml dagidek) — repo variables shart emas
  SERVER_USER: deploy-mysayqal
  SERVER_IP: '45.138.159.141'
  SERVER_PORT: '2222'
  # Serverning SSH host kaliti (sir emas) — boshqa server bilan almashtirib qo'yishdan himoya
  SERVER_HOST_FP: 'SHA256:9LiZG9EIDqd7Hv6vXSZ/cg04Jnrkjhozupzg0XzBtxI'
  DIR: /srv/mysayqal/admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sozlamalar bormi
        run: |
          for v in SERVER_USER SERVER_IP SERVER_PORT SERVER_HOST_FP; do
            if [ -z "${!v}" ]; then echo "::error::Sozlama yo'q: ${v}"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Yig'ish
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: known_hosts (pinned)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SERVER_PORT" -t ed25519 "$SERVER_IP" 2>/dev/null > /tmp/hostkey
          FP=$(ssh-keygen -lf /tmp/hostkey | awk '{print $2}')
          if [ "$FP" != "$SERVER_HOST_FP" ]; then echo "::error::Server host key mos emas: $FP"; exit 1; fi
          cat /tmp/hostkey >> ~/.ssh/known_hosts

      - name: Chiqarish
        run: |
          REL="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          rsync -az -e "ssh -p $SERVER_PORT" dist/ "$SERVER_USER@$SERVER_IP:$DIR/releases/$REL/"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_IP" "set -e; cd $DIR; \
            chmod -R a+rX releases/$REL; ln -sfn releases/$REL current.tmp; mv -Tf current.tmp current; \
            ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf --; echo Tayyor: $REL"
